<body class="font-body-md text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- TopNavBar -->
<header class="fixed top-0 left-0 right-0 z-50 bg-surface border-b border-outline-variant">
<nav class="flex justify-between items-center w-full px-md md:px-xl py-base max-w-container-max mx-auto">
<div class="font-headline-md text-headline-md font-bold text-primary">SimpleSite</div>
<div class="hidden md:flex items-center space-x-md">
<a class="font-label-md text-label-md text-secondary hover:text-primary transition-colors hover:bg-surface-container-low px-3 py-1 rounded-lg" href="#">Home</a>
<a class="font-label-md text-label-md text-primary font-semibold border-b-2 border-primary pb-1" href="#">Hello</a>
</div>
<div class="flex items-center gap-sm">
<button class="bg-primary text-on-primary px-md py-2 rounded-full font-label-md text-label-md hover:bg-primary-container active:scale-95 transition-all duration-200">

                </button>
<button class="md:hidden text-primary">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</nav>
</header>
<main class="pt-xl pb-xl min-h-[calc(100vh-140px)] flex flex-col items-center justify-center">
<!-- Hero / Hello World Section -->
<section class="max-w-container-max mx-auto px-md md:px-xl text-center w-full">
<div class="relative inline-block mb-md">
<div class="absolute -inset-4 bg-primary-fixed-dim opacity-20 blur-2xl rounded-full"></div>
<h1 class="relative font-headline-xl text-[64px] md:text-[80px] leading-tight text-on-surface tracking-tighter">
                    Hello, <span class="text-primary">World!</span>
</h1>
</div>
<p class="font-body-lg text-body-lg text-secondary max-w-2xl mx-auto mb-lg">
                Welcome to a space defined by professional minimalism and calm productivity. We're glad you're here.
            </p>
<!-- Bento-style Interaction Grid -->

</section>
</main>
<!-- Footer -->
<footer class="bg-surface-container-lowest border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-md md:px-xl py-md max-w-container-max mx-auto">

<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors" href="#">Contact</a>
</div>
</div>
</footer>
<script>
        // Micro-interaction for cards
        document.querySelectorAll('.ambient-shadow').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.boxShadow = '0 32px 48px -16px rgba(0, 62, 199, 0.12)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.boxShadow = '0 24px 32px -12px rgba(0, 62, 199, 0.06)';
            });
        });

        // Simple scroll effect for navbar
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 10) {
                header.classList.add('ambient-shadow');
            } else {
                header.classList.remove('ambient-shadow');
            }
        });
    </script>
