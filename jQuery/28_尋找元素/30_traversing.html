<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="css/30_traversing.css" />
    <script src="../_js/jquery-3.7.1.js"></script>
  </head>

  <body>
    <button id="btnPickItem">挑選</button>
    <hr />

    <div id="tw">
      <h4>台灣水果</h4>
      <ul id="twList">
        <li class="grape">巨峰葡萄</li>
        <li>金鑽鳳梨</li>
        <li>麻豆文旦</li>
        <li>小玉西瓜</li>
        <li>大湖草莓</li>
      </ul>
    </div>

    <div id="jp">
      <h4>日本水果</h4>
      <ul id="jpList">
        <li><b class="grape">麝香葡萄</b></li>
        <li><b>夕張哈密瓜</b></li>
        <li><b>甘王草莓</b></li>
        <li><b>愛媛柑橘</b></li>
        <li><b>岡山白桃</b></li>
      </ul>
    </div>

    <div id="demo"></div>
    <button id="a">A</button>
    <button id="b">B</button>
    <button id="c">C</button>
    <button id="d">D</button>

    <script>
      // * 比較底下幾種 尋找|篩選 元素的方式 *

      // 10. filter   ===> $().filter()
      // 11. find     ===> $().find()
      // 12. children ===> $().children()
      // 13. parent   ===> $().parent()
      // 14. closest  ===> $().closest()
      btnPickItem.onclick = function () {
        // #demo
        $("#demo").empty(); //清空*3
        $("li")
          .filter(".grape")
          .each(function () {
            // this.innerText;                              //取得內容*8
            $("#demo").append(`<p> ${this.innerText}</p>`); //新增*5
          });
      };

      a.onclick = function () {
        $("#demo").empty(); //清空*3
        $("li")
          .find(".grape")
          .each(function () {
            $("#demo").empty();
            $("#demo").append(`<p> ${this.innerText}</p>`);
          });
      };

      b.onclick = function () {
        $("#demo").empty(); //清空*3
        $("#twList")
          .children("li")
          .each(function () {
            $("#demo").append(`<p> ${this.innerText}</p>`);
          });
      };
      c.onclick = function () {
        $("#demo").empty(); //清空*3
        $(".grape")
          .parent("ul")
          .each(function () {
            $("#demo").append(`<p> ${this.innerText}</p>`);
          });
      };
      d.onclick = function () {
        $("#demo").empty(); //清空*3
        $(".grape")
          .closest("ul")
          .each(function () {
            $("#demo").append(`<p> ${this.innerText}</p>`);
          });
      };
    </script>
  </body>
</html>
