<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      h3 {
        background: pink;
        button {
          /* 不保留排版空間 */
          /* display: none; */
          /* 保留排版空間 */
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <h3>前方</h3>
    <!-- html disabled 按鈕失效 透明化但存在 -->
    <button disabled>加入購物車</button>
    <h3>後方</h3>
  </body>
</html>
