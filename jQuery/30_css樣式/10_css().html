<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="../_js/jquery-3.7.1.js"></script>
  </head>

  <body>
    <h4>.css()</h4>
    <p><a href="https://api.jquery.com/css/">https://api.jquery.com/css/</a></p>

    <hr />

    <p id="p1">Apple</p>
    <p id="p2">Bee</p>
    <p id="p3">Cat</p>
    <p id="p4">Dog</p>
    <p id="p5">Egg</p>

    <script>
      $(function () {
        let x = $("#p1").css("color");
        console.log(x);

        // 10. 取得 #p1 標籤的文字顏色
        $("#p1").css("color", "blue");
        // 20. 設定 #p1 標籤的文字顏色

        // 30. 取得 h4 標籤的 id
        // 40. 設定 h4 標籤的 id
        //      * 和 $().css() 無關，複習 + 討論先前曾使用過的 function
        let y = $("h4").attr("id");
        console.log(y);
        $("h4").attr("id", "applecat");

        // 50. $().css() 其他型態的參數
        //  * 15_練習_點選改變字型大小.html 練習後回來補充說明
        $("p").css("background-color", "pink");
        $("p").css("width", (index, value) => {
            return index % 2 == 0 ? "0px" : "50px";
        })
        //
        $("p").css({
            // 'font-size':'36px',
            // 'border':'1px solid red'
            fontSize:'36px',
            border:'1px solid red'
        });

      })
    </script>
  </body>
</html>
