<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<p>
    <!-- 試試看 <h1> ~ <h6> tag -->
<h1>title</h1>
<h2>title</h2>
<h3>title</h3>
<h4>title</h4>
<h5>title</h5>
<h6>title</h6>

<!-- 試試看 <p> tag -->
<!-- paragraph，段落 -->

<p> 地址：408台中市南屯區公益路二段51號18樓</p>
<p>電話：(04) 2326-5860</p>


<!-- 試試看 <hr> tag -->
<!-- horizontal rule，分隔網頁內容 -->
<hr>

<!-- 試試看 <br> tag -->
<!-- break，斷行 -->
<!-- 一般按 Enter 不會換行 -->
<br>

<!-- 試試看 <pre> tag -->
<!-- preformatted，在 <pre> 內的文字，格式會被保留下來 -->
<pre>
    蘋果
    貓咪                   小狗
</pre>

<!-- 試試看 <div> tag，division -->
<div>香蕉
    <div> 小香蕉
        <a href="">迷你香蕉</a>
    </div>
</div>

<!-- 區塊元素/層級(block level): 會在元素的前後換行 -->
<!-- 行內元素/層級(inline level): 不會在元素的前後換行 -->
<!-- 區塊元素可以包含區塊元素 -->
<!-- 區塊元素可以包含行內元素 -->


<!-- 試試看 <span> tag -->

三原色有，
<span style="color:red">紅</span>、
<span style="color:green">綠</span>、
<span style="color:blue">藍</span>三種顏色


</body>

</html>
