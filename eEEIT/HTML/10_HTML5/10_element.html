<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>
    <!-- 10. 開始標籤到結束標籤 -> 元素 -->
    <h1>h1</h1>
    <h2>h2</h2>
    <h3>h3</h3>
    <h4>h4</h4>
    <h5>h5</h5>
    <h6><a href="https://www.youtube.com/watch?v=rgS3lV2a91Q&list=RDrgS3lV2a91Q&start_radio=1">h6</a></h6>

    <!-- 20. 元素的屬性 -->
    <h1 id="content">banana</h1>

    <!-- id 屬性值:
        1. 可以自訂
        2. 必須唯一
        3. 有區分大小寫
        4. 至少包含一個字元
        5. 不能以數字開頭
        6. 不能包含空格 -->


    <!-- 21. 不同元素可能有不同屬性。 ex: <a> -->
    <a href="https://www.google.com">googggggggggggggggggle</a>

    <!-- 22. 元素可以有多個屬性。 ex: <a> -->
    <a href="https://www.google.com" id="google">googggggggggggggggggle</a>

    <!-- Alt + Shift + ↑ / ↓：可以複製一行
	     Alt + ↑ / ↓：可以搬移程式碼(可以多行)	
         Alt + Shift + F：格式化(縮排對齊)整份文件 -->

    <!-- 試試看，元素使用不支援的屬性，是否能達到效果? (x)-->
    <!-- <h1 href="https://www.google.com">gooogle</h1> -->


</body>

</html>
