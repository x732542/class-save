<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
<style>
    #dog {
        background-color: blueviolet ;
        width: 20%;
        position: fixed;
        }
    div{
    background-color: aliceblue;
        height: 500px;
    }
</style>
</head>

<body>

    <div> <!-- img的父元素 -->
        <!-- 10. height, width 屬性 -->


        <!-- 11. 設定像素 width="50" -->
        <img id="dog"  src="puppy.jpg" alt="狗" height="100 " width="100">

        <!-- 12. style="width:50%;" -->
        <!-- 圖片的寬度設定為:父元素的寬度的50% -->
        <br>
        <!-- div的子元素 -->
        <img  src="puppy.jpg" style="width: 50%;">
        <img  src="puppy.jpg" style="height: 40%;">
    </div>

</body>

</html>
