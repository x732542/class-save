<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 選擇div元素 */
        div {
            color: #000;
        }

        /* 選擇class=row的div元素 */
        div.row {
            color: #000;
        }

        /* 選擇 id=apple的div元素 */
        div#apple {
            color: #000;
        }
    </style>
</head>

<body>
    <!-- 產生div元素 -->
    <div></div>
    <!-- div.row 產生class=row的div元素 -->
    <div id="dsa" class="dsa czx ewq fsd rqw"></div>
    <!-- div#apple 產生id=apple的div元素 -->
     <div id="apple"></div>
<br>
<div class="row">
    <div class="col-4"></div>
    <div class="col-4"></div>
    <div class="col-4">
        <div class="row">
            <div class="col-12">1</div>
            <div class="col-12">2</div>
        </div>
    </div>
</div>

</body>

</html>
