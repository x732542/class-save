<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>figure</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.bundle.js"></script>

</head>

<body>
    <div class="container">

        <h4>官方網站</h4>
        <p><a
                href="https://getbootstrap.com/docs/5.3/content/figures/">https://getbootstrap.com/docs/5.3/content/figures/</a>
        </p>
        <hr>
        <figure class="row">
            <img src="../image/sunny.jpg" class="img-fluid col-5 figure-img">
            <figcaption class="figure-caption">sunny</figcaption>
        </figure>
        <!-- 10. 練習套用 .figure  .figure-img  以及 .figure-caption  等三個類別   -->

        <!-- 20. 請試著將畫面分成三等分，個別放入一組步驟10完成的項目 -->
        <div class="row">
            <div class="col">
                <figure>
                    <img src="../image/sunny.jpg" class="img-fluid figure-img">
                    <figcaption class="figure-caption">1</figcaption>
                </figure>
            </div>
            <div class="col">
                <figure>
                    <img src="../image/sunny.jpg" class="img-fluid figure-img">
                    <figcaption class="figure-caption">2</figcaption>
                </figure>
            </div>
            <div class="col">
                <figure>
                    <img src="../image/sunny.jpg" class="img-fluid figure-img">
                    <figcaption class="figure-caption">3</figcaption>
                </figure>
            </div>
        </div>
    </div>
</body>

</html>
