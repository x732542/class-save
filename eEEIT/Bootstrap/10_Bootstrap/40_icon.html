<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Icons</title>

    <!-- 10. 根據文件，加入所需的css樣式檔案 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="icons" class="bi bi-octagon-fill">
    <style>
        .bi {
            font-size: 300px;
            color: aqua;
            position: static;
            top: 50px;
            right: 50px;
        }

        .bi:hover {
            color: purple;
        }
    </style>
</head>

<body>

    <h4>Bootstrap Icons #Install</h4>
    <p><a href="https://icons.getbootstrap.com/#install">https://icons.getbootstrap.com/#install</a></p>

    <!-- 20. 練習將圖示帶入到網頁中 -->
    <a class="bi bi-octagon-fill" href="https://www.youtube.com/"></a>
    <i class="bi bi-infinity"></i>

</body>

</html>
