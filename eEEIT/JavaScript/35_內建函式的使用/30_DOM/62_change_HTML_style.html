<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <p id="memo">點選圖片後，放大圖片和文字</p>

    <!-- 10. 設定一張圖片 -->
    <img id="apple" src="../../img/find.png" onclick="zoomIn()">
    <script>
        function zoomIn() {
            var imgElem = document.getElementById('apple');
            // 20. 網頁的 圖片的 樣式的 寬度 改變
            imgElem.style.width = "500px";
            // 21. 網頁的 圖片的 樣式的 高度 改變
            imgElem.style.height = "100px";
            
            // 22. 網頁的 memo的 樣式的 字型 改變
            var str = document.getElementById('memo');
            str.style.fontSize = "50px";
        }
    </script>

</body>

</html>
