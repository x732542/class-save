<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

</head>

<body>

    <button onclick="showMag()">接收輸入，並顯示結果</button>

    <script>
        // var temp =  prompt('test');
        // console.log(temp);
        prompt()
        function showMag() {
            var x = prompt("請輸入x");
            var y = prompt("請輸入y");
            alert(`x+y${parseInt(x) + parseInt(y)}`);
        }
        // 10. 透過 prompt 接收使用者輸入的值，並記錄下來

        // 20. 將記錄到的資訊 alert 出來

    </script>

</body>

</html>
