<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <script>
        // 10. 產生字串，並顯示到主控台
        var str1 = "1.今日特餐是薯餅和紅茶";
        console.log(str1);


        // 20. 透過加號(+)串接變數和字串，並顯示到主控台
        var drink = "紅茶";
        var str2 = "2.今日特餐是薯餅和" + drink;
        console.log(str2);

        var food = "薯餅";
        var str3 = "3.今日特餐是" + food + "和" + drink;
        console.log(str3);

        // 21. `` Template Literals：中文翻譯為 樣板字面值、模板字串等，用 「` `」組成
        var str4 = `4.今日特餐是${food}和${drink}`;
        console.log(str4);
        var str5 = '4.今日特餐是${food}和${drink}';
        console.log(str5);

    </script>

</body>

</html>
