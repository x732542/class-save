<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
</head>


<body>
  
    <script>
        // 1. 取得系統現在時間(HH)
        // 2. 如果是 8點 ~ 11點，在主控台顯示上午課程
        // 3. 如果是 12點，在主控台顯示中午用餐時間
        // 4. 如果是 13點 ~ 16點，在主控台顯示下午課程
        // 5. 其他的時段，在主控台顯示非課程時間


        // 比較運算子: >, <, >=, <=, ==, ...
        // 邏輯運算子: &&, ||


        var d = new Date();
        console.log(d);
        
        var hh = d.getHours();
        // var hh = 9; // 測試用
        console.log(hh);


        if (hh >= 8 && hh <= 11) {
            console.log('上午課程');  

        } else if (hh == 12) {
            console.log('中午用餐時間');
            
        } else if (hh >= 13 && hh <= 16) {
            console.log('下午課程');
            
        } else {
            console.log('非課程時間');            
        }
        


        //-------------------------------------------
        // 6. 透過三元運算子，判斷現在是 'AM' 還是 'PM'
        // (條件) ? 條件成立給這個值 : 條件不成立給這個值;


        // if...else
        // var result;


        // if (hh < 12) {
        //     result = 'AM';
        // } else {
        //     result = 'PM';
        // }


        // console.log(result);




        // 三元運算子
        // (條件) ? 條件成立給這個值 : 條件不成立給這個值;
        var result = (hh < 12) ? 'AM' : 'PM';
        console.log(result);


    </script>
    
</body>


</html>
