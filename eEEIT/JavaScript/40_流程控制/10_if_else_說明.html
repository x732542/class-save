    <h4>JavaScript if else and else if</h4>
    <p><a href='https://www.w3schools.com/js/js_if_else.asp'>https://www.w3schools.com/js/js_if_else.asp</a></p>


    <pre>


        if (條件 1) {
            //  條件 1 is true
        } else if (條件 2) {
            //  the 條件 1 is false and 條件 2 is true
        } else {
            //  the 條件 1 is false and 條件 2 is false
        }
        
    </pre>


    <script>


        // 10. if..else 結構說明
        // var x = 10;
        // var x = 6;
        var x = 1;


        if (x > 8) {
            console.log('a');


        } else if (x > 5) {
            console.log('b');


        } else {
            console.log('c');


        }


        // 20. 其他案例: undefined  null  0
        console.clear();


        // var apple = (10 > 5); // 比較
        // var apple = true; // 布林值


        // var apple = 200; // 非0的數值
        // var apple = "hello"; // 字串


        // var apple = undefined;
        // var apple = null;
        var apple = 0;


        if (apple) {
            console.log('條件成立');


        } else {
            console.log('條件不成立');
        }




        // 30. 巢狀結構的處理 
        console.clear();


        var score = 85;


        if (score >= 90) {console.log('甲上'); } 
        else if (score >= 80) {console.log('甲');} 
        else if (score >= 70) {console.log('乙');} 
        else if (score >= 60) {console.log('丙');} 
        else {console.log('丁');}


    </script>
