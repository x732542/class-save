<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .demo {
            display: flex;
        }

        #reddiv_B {
            flex: 3;
        }

        #greendiv_B {
            flex: 2;
        }

        #bluediv_B {
            flex: 1;
        }
    </style>
</head>

<body>

    <h3> display: block 區塊 </h3>
    <div class="demo">
        <div id="reddiv_A">Red</div>
        <div id="greendiv_A">Green</div>
        <div id="bluediv_A">Blue</div>
    </div>

    <hr>

    <!-- 10. 試試看，在 .demo 加上 display: flex  -->
    <!-- 20. 試試看，在 #reddiv_B、#greendiv_B、#bluediv_B 加上 flex: 自訂的數值 -->

    <h3> display: flex </h3>
    <div class="demo">
        <div id="reddiv_B">Red (flex: 3)</div>
        <div id="greendiv_B">Green (flex: 2)</div>
        <div id="bluediv_B">Blue (flex: 1)</div>
    </div>
</body>

</html>
