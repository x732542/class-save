<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        /* 先開啟網頁觀察畫面 */
        #demo1::before {
            content: "香蕉奇異果";
            color: blue;
        }

        #demo1::after {
            content: "俗俗賣場";
            background-color: aqua;
        }

        h4::after {
            content: "香蕉";
        }

        /* ::after 在元素的內容後面加上其他內容 */
        /* ::before 在元素的內容前面加上其他內容 */
    </style>

</head>

<body>
    <h4>Pseudo-elements, 虛擬元素</h4>
    <h4>透過CSS產生網頁上的內容</h4>
    <hr>
    <p id="demo1">奇異博士</p>
    <p id="demo2">復仇者聯盟</p>
</body>

</html>
