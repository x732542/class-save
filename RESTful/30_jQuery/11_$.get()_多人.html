<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多人資料</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  </head>
  <body>
    <button id="btnGetData">取得資料</button>
    <div id="divResult" class="row">
      <!-- BS -->
      <!-- 一個div占三個空間；一個人要顯示的資訊為img和P -->
    </div>
    <script>
      const url = "https://randomuser.me/api/?results=10";
      btnGetData.onclick = function () {
        $.get(url, (data) => {
          $.each(data.results, (i, v) => {
            // console.log(v);
            let elem = $("<div>"); // = <div></div>
            elem.addClass("col-3");
            elem.append(`<img src="${v.picture.medium}">`);
            elem.append(`<p>${v.email}</p>`);
            $("#divResult").append(elem);
          });
        });
      };
    </script>
  </body>
</html>
