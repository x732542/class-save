      btnGetFileTV1.onclick = function () {

          // $('#divLeft').html(this.responseText);
          divRight.innerText = this.responseText;
        });
        // apple.open("GET", "../_file/bigfile.txt");
        apple.open("GET", "../_file/smallfile.txt");
        apple.send();
      };

      btnGetFileTV2.onclick = function () {
