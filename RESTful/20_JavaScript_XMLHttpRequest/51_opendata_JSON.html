<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>學生練習版 - 農業景點 Open Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      img {
        border-radius: 12px;
      }
      p {
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        max-width: 100ch;
      }
      table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>

  <body>
    <h4>全國休閒農業區旅遊資訊</h4>
    <p>
      <a href="https://data.gov.tw/dataset/6406" target="_blank"
        >https://data.gov.tw/dataset/6406</a
      >
    </p>
    <hr />
    <h4>JSON資料</h4>
    <p>
      <a
        href="https://data.moa.gov.tw/Service/OpenData/ODwsv/ODwsvAttractions.aspx?IsTransData=1&UnitId=192"
        >https://data.moa.gov.tw/Service/OpenData/ODwsv/ODwsvAttractions.aspx?IsTransData=1&UnitId=192</a
      >
    </p>
    <hr />
    <button id="btnGetOpenData">取得景點資料</button>
    <button id="btnGetOpenDataV1">取得景點資料(含圖片)</button>
    <button id="btnGetOpenDataV2">取得景點資料(表格白板)</button>
    <hr />
    <div id="divResult"></div>

    <script>
      // 10. 請下載農業景點資料到電腦中 (或是直接使用 URL)

      // 20. 當按鈕點選時，載入景點資料
      //     將 名稱、地址、電話 顯示在畫面上
      btnGetOpenData.onclick = function () {
        let xhr = new XMLHttpRequest();

        xhr.addEventListener("load", function () {
          //   console.log(this.responseText);
          let data = JSON.parse(this.responseText);
          //   console.log(data); // ->迴圈五選一 :forEach
          data.forEach((value) => {
            // console.log(value);
            divResult.innerHTML += `<p> <b> 景點:</b> ${value.Name}</p>`;
            divResult.innerHTML += `<p> <b> 電話:</b> ${value.Tel}</p>`;
            divResult.innerHTML += `<p> <b> 地址:</b> ${value.County} ${value.Town} ${value.Address}</p>`;
            divResult.innerHTML += `<hr>`;
          });
        });
        xhr.open("GET", "../_file/ODwsvAttractions.customization.json");
        xhr.send();
      };
      btnGetOpenDataV1.onclick = function () {
        let xhr = new XMLHttpRequest();

        xhr.addEventListener("load", function () {
          //   console.log(this.responseText);
          let data = JSON.parse(this.responseText);
          //   console.log(data); // ->迴圈五選一 :forEach
          data.forEach((value) => {
            // console.log(value);
            // divResult.innerHTML += `<p> <b> 景點:</b> ${value.Name}</p>`;
            // divResult.innerHTML += `<p> <b> 電話:</b> ${value.Tel}</p>`;
            // divResult.innerHTML += `<p> <b> 地址:</b> ${value.County} ${value.Town} ${value.Address}</p>`;
            divResult.innerHTML += `<h1>      ${value.Name}</h1>`;
            divResult.innerHTML += `<img src="${value.Photolink}">`;
            divResult.innerHTML += `<p>       ${value.Introduction}</p>`;
            divResult.innerHTML += `<hr>`;
          });
        });
        xhr.open("GET", "../_file/ODwsvAttractions.customization.json");
        xhr.send();
      };
      btnGetOpenDataV2.onclick = function () {
        let xhr = new XMLHttpRequest();

        xhr.addEventListener("load", function () {
          //   console.log(this.responseText);
          let data = JSON.parse(this.responseText);
          //   console.log(data); // ->迴圈五選一 :forof
          // divResult.innerHTML += `<table><tr><th>名稱</th><th>地址</th><th>電話</th></tr>`;
          let temp = "<table><tr><td>名稱</td><td>地址</td><td>電話</td></tr>";

          for (const apple of data) {
            // console.log(apple);
            temp += `<tr>`;
            temp += `<th>${apple.Name}</th>`;
            temp += `<th>${apple.County}${apple.Town}${apple.Address}</th>`;
            temp += `<th>${apple.Tel}</th>`;
            temp += `</tr>`;
          }

          temp += `</table>`;
          divResult.innerHTML += temp;
          
          // 機器人會做錯 不是人思維的問題
          // divResult.innerHTML = "<table><tr><td>名稱</td><td>地址</td><td>電話</td></tr>";

          // for (const apple of data) {
          //   // console.log(apple);
          //   divResult.innerHTML += `<tr>`;
          //   divResult.innerHTML += `<th>${apple.Name}</th>`;
          //   divResult.innerHTML += `<th>${apple.County}${apple.Town}${apple.Address}</th>`;
          //   divResult.innerHTML += `<th>${apple.Tel}</th>`;
          //   divResult.innerHTML += `</tr>`;
          // }
          // divResult.innerHTML += `</table>`;
        });
        xhr.open("GET", "../_file/ODwsvAttractions.customization.json");
        xhr.send();
      };
    </script>
  </body>
</html>
